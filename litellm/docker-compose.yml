# LiteLLM OpenAI-compatible gateway + Postgres (keys, spend, UI models).
#
# Host layout (persistent state under this folder):
#   config.yaml          /app/config.yaml     models + LLM classifier router
#   data/postgres        Postgres data
#   .env                 master/salt keys + Strata credentials (not committed)
#
# UI:  http://<host>:4000/ui   (user admin, password = LITELLM_MASTER_KEY)
# API: http://<host>:4000/v1

name: litellm

services:
  litellm:
    # main-latest required for native opencode_go/ provider
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Skopje}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
      STRATA_API_BASE: ${STRATA_API_BASE:-http://192.168.1.134:8080/v1}
      STRATA_API_KEY: ${STRATA_API_KEY}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./opencode_session_hook.py:/app/opencode_session_hook.py:ro
      - ./go_router.py:/app/go_router.py:ro
      # Route handoff to the OpenCode TUI plugin: one small JSON per session.
      - ./routes:/app/routes
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
      - "--host=0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16
    container_name: litellm_db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Skopje}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10

  # Claude Code OAuth bridge. Anthropic rejects subscription OAuth from
  # non-Claude-Code clients (429), so Claude models go through this proxy, which
  # speaks the Claude Code transport. LiteLLM calls it as an OpenAI-compatible
  # upstream (api_base http://cliproxyapi:8317/v1).
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Skopje}
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./cliproxy/auth:/root/.cli-proxy-api
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 2 bash -c '</dev/tcp/127.0.0.1/8317' || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

